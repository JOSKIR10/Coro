<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://itunes.apple.com; connect-src 'self' https://itunes.apple.com https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob: https://*.mzstatic.com https://*.supabase.co; media-src https://*.apple.com https://*.mzstatic.com; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0f0c1d">
<meta name="description" content="Coro: la red social para compartir fragmentos de canciones y tu top de favoritas.">
<title>Coro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f0c1d;--card:#1a1630;--card2:#241f40;--text:#f4f1ff;--muted:#a59fc6;--accent:#ff4f8b;--accent2:#7c5cff;--ok:#3ddc97;--line:#2e2850;--glass:rgba(15,12,29,.9);--r:20px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);transition:background .3s;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;background:radial-gradient(40vmax 40vmax at 15% 10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),radial-gradient(45vmax 45vmax at 90% 80%,color-mix(in srgb,var(--accent2) 22%,transparent),transparent 70%);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(3vmax,-2vmax)}}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none}
main{max-width:620px;margin:0 auto;padding:16px}
.card{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.author{font-weight:700;text-decoration:none}
.author:hover{text-decoration:underline}
.text{white-space:pre-wrap;word-wrap:break-word;margin:10px 0}
.track{display:flex;gap:12px;align-items:center;background:var(--card2);border-radius:12px;padding:10px}
.track img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--line);position:relative;z-index:1;transition:transform .4s,border-radius .4s}
.disc{position:relative;flex:none;width:56px;height:56px}
.vinyl{position:absolute;top:2px;left:2px;width:52px;height:52px;border-radius:50%;background:repeating-radial-gradient(#111 0 2px,#222 2px 4px);box-shadow:inset 0 0 0 17px #151515,inset 0 0 0 19px var(--accent);transition:transform .4s}
.track.playing .vinyl{transform:translateX(22px);animation:spin 1.8s linear infinite}
.track.playing img{transform:translateX(-4px) scale(.96)}
@keyframes spin{from{transform:translateX(22px) rotate(0)}to{transform:translateX(22px) rotate(360deg)}}
.track.playing{box-shadow:0 0 0 1px var(--accent),0 8px 30px -12px var(--accent)}
.track .info{flex:1;min-width:0;padding-left:2px}
.track.playing .info{padding-left:22px;transition:padding .4s}
.track .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .artist{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;background:var(--accent);display:grid;place-items:center;position:relative}
.play svg{width:20px;height:20px;fill:#fff}
.play .ring{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#fff var(--p,0%),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0);pointer-events:none}
.actions{display:flex;gap:14px;margin-top:10px;align-items:center}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center;padding:6px;border-radius:8px}
.icon-btn:hover{background:var(--card2);color:var(--text)}
.icon-btn.on{color:var(--accent)}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.btn{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;transition:transform .12s,filter .2s}
.btn:active,.icon-btn:active,.palette:active,.album:active{transform:scale(.95)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.sso{display:flex;align-items:center;justify-content:center;gap:10px}
.btn.sso svg{width:20px;height:20px;fill:currentColor}
.btn.sso-apple{background:#fff;color:#000}
.btn.sso-fb{background:#1877f2;color:#fff}
input[type=text],input[type=email],input[type=password],input[type=search],textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
textarea{resize:vertical;min-height:90px}
label{font-size:14px;color:var(--muted)}
.results{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto}
.results .track{cursor:pointer;border:1px solid transparent}
.results .track:hover{border-color:var(--accent2)}
.results .track.sel{border-color:var(--accent)}
nav.bottom{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;display:flex;justify-content:space-around;padding:6px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;max-width:520px;margin:0 auto;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:999px;transition:background .2s,color .2s}
nav.bottom a.act{color:var(--text);background:var(--card2)}
nav.bottom svg{width:24px;height:24px;fill:currentColor}
nav.bottom a.plus svg{width:30px;height:30px;color:var(--accent)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.avatar.big{width:84px;height:84px;font-size:32px}
img.avatar{object-fit:cover;background:var(--card2);box-shadow:0 0 0 2px var(--accent)}
.avatar.sm{width:30px;height:30px;font-size:13px}
.comments{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.comment{display:flex;gap:8px;align-items:flex-start}
.comment .text{font-size:15px}
.bell{position:relative}
.bell.dot::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.danger{border-color:color-mix(in srgb,#ff4d4d 45%,var(--line))}
.ico-inline svg{width:18px;height:18px;fill:currentColor;vertical-align:-3px}
.act-ico{font-size:20px}
.top-list{counter-reset:n;display:flex;flex-direction:column;gap:8px}
.top-list .track::before{counter-increment:n;content:counter(n);font-weight:900;font-size:26px;width:30px;text-align:center;background:linear-gradient(180deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted)}
.tabs button.act{background:var(--card2);color:var(--text);border-color:var(--accent2)}
.slider{width:100%;accent-color:var(--accent)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.banner{background:var(--card2);border:1px dashed var(--accent2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:90vw;text-align:center}
.count{font-size:13px;color:var(--muted);text-align:right}
.mini{display:flex;gap:6px}
.mini button{padding:4px 8px}
.spacer{flex:1}
.apple{display:block;font-size:12px;color:var(--muted);text-decoration:none}
.apple:hover{text-decoration:underline}
.profile-head{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 25%,var(--card)),color-mix(in srgb,var(--accent2) 25%,var(--card)));color:var(--text)}
.palettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.palette{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:2px solid transparent;cursor:pointer;font-weight:600;text-align:left}
.palette.act{border-color:var(--text)}
.palette .dots{display:flex}.palette .dots i{width:18px;height:18px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.6)}.palette .dots i+i{margin-left:-6px}
.swatch-in{display:flex;align-items:center;gap:8px;color:var(--text);background:var(--card2);padding:6px 12px 6px 6px;border-radius:999px}
.swatch-in input{width:34px;height:34px;border:0;border-radius:50%;padding:0;background:none;cursor:pointer}
.swatch-in input::-webkit-color-swatch-wrapper{padding:0}.swatch-in input::-webkit-color-swatch{border:2px solid var(--line);border-radius:50%}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.album{display:flex;flex-direction:column;gap:4px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;transition:transform .12s}
.album-cover{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.album-cover.big{width:96px;flex:none;font-size:48px}
.album-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.album-head{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,var(--card)),var(--card))}
.covers{display:flex;flex-wrap:wrap;gap:6px}
.covers button{font-size:24px;width:46px;height:46px;border-radius:12px;border:2px solid transparent;background:var(--card2);cursor:pointer}
.covers button.act{border-color:var(--accent)}
input[type=url]{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
#hdr{gap:4px}
.user-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px}
.user-row:hover{background:var(--card2)}
.btn.follow{padding:8px 16px;font-size:14px;flex:none}
.empty.col{display:flex;flex-direction:column;gap:14px}
.clip-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:1px 8px;border-radius:999px;margin:3px 0 1px}
.hero{display:flex;flex-direction:column;gap:6px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--card)),color-mix(in srgb,var(--accent2) 30%,var(--card)));overflow:hidden;position:relative}
.hero h1{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.5px;max-width:90%}
.hero p{margin:0 0 6px}
.hero-notes{position:absolute;right:12px;top:6px;font-size:28px;opacity:.25;letter-spacing:6px;animation:float 5s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(8px) rotate(-6deg)}}

body.welcome-mode nav.bottom,body.welcome-mode header.top{display:none}
body.welcome-mode{padding-bottom:0}
.welcome{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px 8px}
.w-orbit{position:relative;width:170px;height:170px;display:grid;place-items:center}
.w-orbit .disc.huge{width:150px;height:150px}
.w-orbit span[class^=n]{position:absolute;font-size:30px;color:var(--accent);animation:float 3s ease-in-out infinite alternate}
.w-orbit .n1{top:0;left:6px}.w-orbit .n2{right:0;top:30px;color:var(--accent2);animation-delay:.8s}.w-orbit .n3{bottom:4px;left:24px;animation-delay:1.6s}
.w-logo{font-size:64px;font-weight:900;letter-spacing:-3px;line-height:1;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.w-tag{font-size:20px;font-weight:600;max-width:340px;margin:0}
.w-feats{list-style:none;padding:0;margin:0;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.disc.huge{width:220px;height:220px;position:relative;margin:0 auto}
.disc.huge .vinyl{inset:0;width:100%;height:100%;top:0;left:0;box-shadow:inset 0 0 0 30% #151515;background:repeating-radial-gradient(#111 0 3px,#222 3px 6px)}
.disc.huge .vinyl::after{content:"";position:absolute;inset:35%;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.disc.huge img{position:absolute;inset:18%;width:64%;height:64%;border-radius:50%;object-fit:cover;z-index:1}
.disc.huge img[src=""]{display:none}
.spin .vinyl,.disc.huge.spin img{animation:spin0 6s linear infinite}
@keyframes spin0{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.chip.act{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.chip.ded{border-color:var(--accent)}
.chip-row{background:var(--card2);padding:8px;border-radius:12px}
.duel-q{margin:10px 0 4px;text-align:center;font-size:18px}
.duel-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;margin-top:8px}
.duel-side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--card2);border-radius:16px;padding:12px 8px;border:2px solid transparent;min-width:0}
.duel-side.mine{border-color:var(--accent)}
.duel-side .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.duel-side .disc.big{width:84px;height:84px;position:relative}
.duel-side .disc.big img{width:84px;height:84px;border-radius:12px;position:relative;z-index:1}
.duel-side .disc.big .vinyl{width:76px;height:76px;top:4px;left:4px}
.duel-side .btn{padding:8px 18px;width:100%}
.vs{align-self:center;font-weight:900;font-style:italic;font-size:22px;background:linear-gradient(180deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{position:relative;width:100%;height:28px;border-radius:999px;background:var(--card);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.bar span{position:relative;font-size:12px;font-weight:700;line-height:28px;color:var(--text)}
.sotd{display:block;margin-top:12px;padding:10px;border-radius:16px;background:color-mix(in srgb,var(--bg) 35%,transparent);text-decoration:none}
.sotd .kicker{margin-bottom:6px}
.empty-sotd{font-weight:700;border:1px dashed var(--accent)}
.kicker{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.compat{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px;border-radius:16px;background:color-mix(in srgb,var(--bg) 35%,transparent)}
.ring-score{--s:0;flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--s)*1%),var(--line) 0)}
.ring-score b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--card);font-size:14px}
.capsule-cta{display:block;text-align:center;text-decoration:none;margin-bottom:12px;border:1px solid var(--accent)}
.capsule{--h:0;position:relative;min-height:calc(100svh - 200px);border-radius:24px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 70%,hsl(var(--h) 80% 30%)),color-mix(in srgb,var(--accent2) 70%,#000));color:#fff;transition:background 1s}
.capsule .slide{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:40px 20px;max-width:440px}
.capsule .slide.enter{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}}
.capsule h1{margin:0;font-size:32px;line-height:1.1}.capsule h2{margin:0;font-size:26px}
.capsule .muted{color:rgba(255,255,255,.8)}
.capsule .kicker{color:#fff;opacity:.85}
.capsule .year{font-size:72px;font-weight:900;letter-spacing:-3px}
.capsule .big-emoji{font-size:64px}
.capsule .stats{display:flex;gap:28px}.capsule .stats div{display:flex;flex-direction:column}.capsule .stats b{font-size:48px}
.capsule .dots{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px}
.capsule .dots i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3)}
.capsule .dots i.done{background:#fff}
.capsule .dots i.now{background:linear-gradient(90deg,#fff 50%,rgba(255,255,255,.3) 50%);background-size:200% 100%;animation:fill 5s linear forwards}
@keyframes fill{from{background-position:100% 0}to{background-position:0 0}}
.capsule .btn.ghost{background:rgba(255,255,255,.2);color:#fff}

/* ---------- Animaciones vivas ---------- */
.tap-ripple{position:fixed;z-index:50;pointer-events:none;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--accent);animation:ripple .6s ease-out forwards}
.tap-ripple.strong{border-color:var(--accent2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent);animation-duration:.7s}
@keyframes ripple{to{transform:scale(5);opacity:0}}
.welcome{position:relative;z-index:1}
.eq-floor{position:fixed;left:0;right:0;bottom:0;height:22vh;display:flex;align-items:flex-end;gap:4px;padding:0 4px;pointer-events:none;z-index:0;opacity:.55;
  -webkit-mask:linear-gradient(to top,#000 40%,transparent);mask:linear-gradient(to top,#000 40%,transparent)}
.eq-floor i{flex:1;height:var(--max);border-radius:6px 6px 0 0;background:linear-gradient(to top,var(--accent),var(--accent2));transform-origin:bottom;animation:eqbar var(--d) ease-in-out var(--del) infinite alternate}
@keyframes eqbar{from{transform:scaleY(calc(var(--min) / var(--max) * 1))}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.eq-floor i{transform:scaleY(.4)}}
.w-orbit .wave{position:absolute;inset:10px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:wave-out 3.2s ease-out infinite}
.w-orbit .wave.w2{border-color:var(--accent2);animation-delay:.8s}
.w-orbit .wave.w3{animation-delay:1.6s}
.w-orbit .wave.w4{border-color:var(--accent2);animation-delay:2.4s}
@keyframes wave-out{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(2.6)}}
body.welcome-mode::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vmax 60vmax at 50% 35%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 60%);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.4;transform:scale(1)}15%{opacity:1;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){body.welcome-mode::after{animation:none;opacity:.6}}
.w-logo{background:none;color:var(--accent)}
.w-logo span{display:inline-block;animation:drop .7s cubic-bezier(.3,1.6,.5,1) both,wave 3s ease-in-out 1.2s infinite}
.w-logo span:nth-child(1){color:var(--accent)}.w-logo span:nth-child(2){color:color-mix(in srgb,var(--accent) 67%,var(--accent2))}
.w-logo span:nth-child(3){color:color-mix(in srgb,var(--accent) 33%,var(--accent2))}.w-logo span:nth-child(4){color:var(--accent2)}
.w-logo span:nth-child(2){animation-delay:.24s,1.35s}.w-logo span:nth-child(3){animation-delay:.33s,1.5s}.w-logo span:nth-child(4){animation-delay:.42s,1.65s}
@keyframes drop{from{opacity:0;transform:translateY(-60px) scale(.6)}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shine{to{background-position:200% 0}}
.welcome>*{animation:rise-in .7s cubic-bezier(.2,.9,.3,1) both}
.welcome>:nth-child(1){animation-delay:0s}.welcome>:nth-child(3){animation-delay:.5s}.welcome>:nth-child(4){animation-delay:.65s}.welcome>:nth-child(5){animation-delay:.8s}.welcome>:nth-child(6){animation-delay:.95s}
.w-logo{animation:none!important}
@keyframes rise-in{from{opacity:0;transform:translateY(24px)}}
.welcome .btn{animation:breathe 2.6s ease-in-out 1.6s infinite}

.page-in>*{animation:rise-in .45s cubic-bezier(.2,.9,.3,1) both}
.page-in>:nth-child(2){animation-delay:.05s}.page-in>:nth-child(3){animation-delay:.1s}.page-in>:nth-child(4){animation-delay:.15s}.page-in>:nth-child(n+5){animation-delay:.2s}
.boing{animation:boing .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes boing{30%{transform:scale(.9)}100%{transform:scale(1)}}
.icon-btn.pop svg{animation:heartpop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes heartpop{0%{transform:scale(1)}40%{transform:scale(1.6) rotate(-12deg)}100%{transform:scale(1)}}

.play{transition:transform .2s}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}50%{box-shadow:0 0 0 9px transparent}}
.track.playing .info .name::after{content:"";display:inline-block;width:14px;height:12px;margin-left:8px;vertical-align:middle;background:linear-gradient(var(--accent),var(--accent)) 0 100%/3px 40% no-repeat,linear-gradient(var(--accent),var(--accent)) 5px 100%/3px 90% no-repeat,linear-gradient(var(--accent),var(--accent)) 10px 100%/3px 60% no-repeat;animation:eq .8s steps(4) infinite}

.card{transition:transform .25s,box-shadow .25s}
